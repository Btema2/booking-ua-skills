<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Rubik 800 (headings) + Onest 400/500/600/700 (body) — the two faces named in
      the font section of src/styles/tokens.css. Google serves the Cyrillic subset
      through unicode-range, so a Ukrainian UI never falls through to the OS sans.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@800&family=Onest:wght@400;500;600;700&display=swap"
    />
    <title>Бронювання переговорних</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
