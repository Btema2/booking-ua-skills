services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      # `:-` fallbacks match .env.example's defaults, so a clean clone boots
      # with zero manual steps even before anyone runs `cp .env.example .env`.
      POSTGRES_USER: ${POSTGRES_USER:-booking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booking}
      POSTGRES_DB: ${POSTGRES_DB:-booking}
    ports:
      # Host side 5433, not 5432: avoids clashing with a local Postgres a judge
      # machine may already have running on the standard port. Container-internal
      # port stays 5432 — the api service talks to `db:5432` over the compose
      # network, unaffected by this remap.
      - "5433:5432"
    volumes:
      - booking-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      # `:-false` so an older .env without this key still boots over plain http.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-booking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booking}
      POSTGRES_DB: ${POSTGRES_DB:-booking}
      NOTIFY_BEFORE_MINUTES: ${NOTIFY_BEFORE_MINUTES:-10}
    ports:
      - "3000:3000"

volumes:
  booking-db-data:
